<title>Carnet SMPM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Concept : appli de terrain, une main. Logo en tête, deux grandes tuiles (bleu = entraînement, rouge = intervention), Bilan en jaune, barre d'onglets en bas. */
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --surface2:#F3F5F8; --ink:#14202E; --muted:#586577; --line:#D3DAE3;
  --red:#D6191F; --blue:#1F62C9; --yellow:#FFC21A; --navy:#14202E;
  --red-text:#C4161C; --blue-text:#1F62C9; --focus:#1F62C9;
  --mapbg:#DCE3EA; --mapgrid:#CBD4DD;
  --s0:#2a78d6; --s1:#eb6834; --s2:#1baf7a; --s3:#eda100; --s4:#e87ba4; --s5:#008300; --s6:#4a3aa7; --sx:#98a2ae;
  --font-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1520; --surface:#162232; --surface2:#1C2B3D; --ink:#E8EEF6; --muted:#9AA8BA; --line:#2A3B51;
    --red-text:#FF7B80; --blue-text:#7DB2F7; --focus:#7DB2F7;
    --mapbg:#1B2736; --mapgrid:#243448; --s0:#3987e5; --s1:#d95926; --s2:#199e70; --s3:#c98500; --s4:#d55181; --s5:#008300; --s6:#9085e9; --sx:#6b7686; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1520; --surface:#162232; --surface2:#1C2B3D; --ink:#E8EEF6; --muted:#9AA8BA; --line:#2A3B51;
  --red-text:#FF7B80; --blue-text:#7DB2F7; --focus:#7DB2F7;
  --mapbg:#1B2736; --mapgrid:#243448; --s0:#3987e5; --s1:#d95926; --s2:#199e70; --s3:#c98500; --s4:#d55181; --s5:#008300; --s6:#9085e9; --sx:#6b7686; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.05em;margin:0;font-weight:700;text-wrap:balance}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.ic{flex:none}

#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:var(--bg)}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px}
.screen.mapscreen{padding:0;position:relative;overflow:hidden}
.tabbar{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.02em}
.tab[aria-current="page"]{color:var(--red-text);box-shadow:inset 0 3px 0 var(--red)}

/* Accueil */
.home{display:flex;flex-direction:column;align-items:center;gap:18px}
.logo{width:min(48vw,176px);aspect-ratio:1;border-radius:50%;display:block;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line);margin-top:4px}
.apptitle{font-size:30px;line-height:1}
.demo{width:100%;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px dashed var(--line);font-size:14px;color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--blue-text);font-weight:600;text-decoration:underline}
.tiles{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tl{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:26px;min-height:150px;padding:14px;border:0;border-radius:16px;color:#fff;text-align:left;min-width:0}
.tl.t{background:var(--blue)} .tl.i{background:var(--red)}
.tl .k{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.92;display:block}
.tl .v{font-family:var(--font-display);font-weight:700;text-transform:uppercase;font-size:clamp(20px,6vw,26px);line-height:1;letter-spacing:.03em;display:block}
.tl:active{transform:scale(.98)}
.bilan{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 34px;border:0;border-radius:26px;background:var(--yellow);color:var(--navy);font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.08em;text-transform:uppercase}
.sect{width:100%;display:flex;flex-direction:column;gap:8px}
.sect h3{font-size:15px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;min-width:0}
.row .dot{flex:none;display:grid;place-items:center;width:32px}
.row .rt{flex:1;min-width:0;display:flex;flex-direction:column}
.row .rt b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row>.ic{color:var(--muted)}
.empty{padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);text-align:center;font-size:14px}

/* Formulaires */
.fhead{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.fhead h2{flex:1;font-size:24px;min-width:0}
.iconbtn-s{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.chip{padding:4px 10px;border-radius:999px;color:#fff;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.chip.c-t{background:var(--blue)} .chip.c-i{background:var(--red)}
.form{display:flex;flex-direction:column;gap:16px}
.form.is-i{--tint:var(--red)} .form.is-t{--tint:var(--blue)}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field>label,.lbl{font-weight:600;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input[type=text],select{width:100%;min-height:50px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.btn.ghost{background:transparent}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px}
.btn.primary{background:var(--tint,var(--blue));border-color:transparent;color:#fff;font-size:17px;letter-spacing:.02em}
.btn.danger{background:var(--red);border-color:transparent;color:#fff}
.btn[disabled]{opacity:.6}
.hint{margin:0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.err{margin:0;font-size:13px;color:var(--red-text);font-weight:600}
#addrExtra{display:flex;flex-direction:column;gap:8px}
#addrExtra:empty{display:none}
.row2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;min-height:40px;font-size:15px}
.chk input,.opt input{width:22px;height:22px;accent-color:var(--blue);flex:none}
.dd{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.dd-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 12px;background:none;border:0;text-align:left}
.dd-l{flex:1;font-weight:600;min-width:0}
.dd-s{color:var(--muted);font-size:14px;white-space:nowrap}
.dd-btn .ic{color:var(--muted);transition:transform .15s}
.dd-btn[aria-expanded="true"] .ic{transform:rotate(180deg)}
.dd-p{border-top:1px solid var(--line);padding:4px 12px 12px}
.opt{display:flex;align-items:center;gap:12px;min-height:44px}
.dd-p .oth{margin-top:4px}
.pa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;padding:10px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;text-align:center;cursor:pointer}
.pbtn .ic{color:var(--blue-text)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.thumbs:empty{display:none}
.th{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface2);border:0;padding:0}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.thx{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(10,16,24,.75);color:#fff;display:grid;place-items:center}

/* Fiche */
.dhead{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.dhead h2{font-size:26px}
.kv{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.kv h3{font-size:14px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:5px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.brow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.brow .full{grid-column:1/-1}

/* Photos */
.phead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.phead h2{flex:1;font-size:26px}
.grp{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.grp h3{font-size:15px;color:var(--muted);text-transform:capitalize;letter-spacing:.03em}

/* Bilan */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--surface2);border-radius:12px;margin-bottom:14px}
.seg button{min-height:42px;border:0;border-radius:9px;background:none;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{padding:12px 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--font-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.t b{color:var(--blue-text)} .stat.i b{color:var(--red-text)}
.bars{display:flex;flex-direction:column;gap:10px}
.bl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:14px}
.bl .n{font-variant-numeric:tabular-nums;font-weight:600}
.bar{grid-column:1/-1;display:flex;height:12px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%}
.bar .bt{background:var(--blue)} .bar .bi{background:var(--red)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.bsec{margin-bottom:20px;display:flex;flex-direction:column;gap:10px}
.bsec>h3{font-size:16px}

.cc{padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.prow{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.pie{width:min(100%,170px);height:auto;flex:none;margin:0 auto;display:block}
.lg{list-style:none;margin:0;padding:0;flex:1 1 170px;min-width:0;display:flex;flex-direction:column;gap:6px}
.lg li{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0;padding:2px 0}
.lg .sw{width:12px;height:12px;border-radius:3px;flex:none}
.lg .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg .vv{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.tt{margin:0;font-size:13px;color:var(--muted);min-height:20px}
.ch{margin:6px 0 0;font-size:13px;font-weight:600;color:var(--muted)}
.cscroll{overflow-x:auto}
.cscroll svg{display:block}
.ax{font-size:9.5px;fill:var(--muted);font-variant-numeric:tabular-nums}
.ay{font-weight:600}
.grid{stroke:var(--line);stroke-width:1}
.base{stroke:var(--muted);stroke-width:1}
.tip{cursor:pointer}
.dtab summary{font-size:13px;font-weight:600;color:var(--blue-text);min-height:36px;display:flex;align-items:center;cursor:pointer}
.dtab table{width:100%;border-collapse:collapse;font-size:13px;min-width:320px}
.dtab th,.dtab td{text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.dtab thead th{color:var(--muted);font-weight:600}
.dtab td:nth-child(2){font-variant-numeric:tabular-nums}

/* Carte */
.vp{position:absolute;inset:0;overflow:hidden;background-color:var(--mapbg);background-image:linear-gradient(var(--mapgrid) 1px,transparent 1px),linear-gradient(90deg,var(--mapgrid) 1px,transparent 1px);background-size:64px 64px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.tl-layer,.mk-layer{position:absolute;inset:0;overflow:hidden}
.mt{position:absolute;left:0;top:0;width:256px;height:256px;max-width:none;will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:none}
.mk-layer{pointer-events:none}
.mk{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;padding:0;line-height:0;cursor:pointer;touch-action:none}
.mk .cnt{position:absolute;top:-2px;right:-8px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#fff;color:#14202E;font:700 12px/20px var(--font-body);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.me{position:absolute;left:0;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#1F62C9;border:3px solid #fff;box-shadow:0 0 0 6px rgba(31,98,201,.25)}
.ctl{position:absolute;z-index:5}
.cbtn{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.cs{right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px}
.zoom{display:flex;flex-direction:column;border-radius:24px;background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.3);overflow:hidden}
.zoom button{width:48px;height:46px;border:0;background:none;display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--line)}
.leg{left:16px;top:12px;display:flex;flex-direction:column;gap:5px;padding:8px 10px;border-radius:10px;background:var(--surface);box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:12px;font-weight:600}
.leg span{display:flex;align-items:center;gap:7px}
.leg i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.mhint{left:16px;bottom:16px;max-width:calc(100% - 100px);padding:7px 10px;border-radius:10px;background:rgba(20,32,46,.85);color:#fff;font-size:12px}
.attr{position:absolute;left:0;bottom:0;z-index:4;padding:1px 6px;background:rgba(255,255,255,.8);color:#333;font-size:10px;border-top-right-radius:6px}
.attr a{color:#1F4E9E}
.pick{left:16px;right:16px;top:12px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--navy);color:#fff;font-size:14px}
.pick span{flex:1}
.pick button{min-height:38px;padding:0 12px;border-radius:9px;border:1px solid rgba(255,255,255,.4);background:none;color:#fff;font-weight:600}
.pick~.leg{top:78px}

/* Feuilles et fenêtres */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(8,14,22,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet h3{font-size:20px}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:12px;text-align:center;min-width:0}
.pk b{font-size:13px}
.pk small{color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb{align-items:center;padding:16px}
.lbox{width:100%;max-width:560px;background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;max-height:94%;overflow-y:auto}
.lbox img{width:100%;max-height:56vh;object-fit:contain;border-radius:10px;background:var(--surface2);display:block}
textarea.cp{width:100%;min-height:180px;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface2)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;margin:0 auto;max-width:420px;padding:12px 14px;border-radius:12px;background:var(--navy);color:#fff;font-size:14px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #toast{background:#E8EEF6;color:#14202E}}
:root[data-theme="dark"] #toast{background:#E8EEF6;color:#14202E}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.tl:active{transform:none}}
</style>

<div id="app"><main id="main" class="screen"></main><nav class="tabbar" id="tabbar" aria-label="Navigation principale"></nav></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>

var fmtFR=function(iso){var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(iso||'');return m?m[3]+'/'+m[2]+'/'+m[1]:''};
function parseFR(s){var m=/^(\d\d)\/(\d\d)\/(\d{4})$/.exec(s);if(!m)return null;var d=+m[1],mo=+m[2],y=+m[3];var t=new Date(y,mo-1,d);if(t.getFullYear()!==y||t.getMonth()!==mo-1||t.getDate()!==d)return null;return y+'-'+m[2]+'-'+m[1]}
var longDate=function(iso){return new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})};
var coord=function(o){return o&&o.lat!=null?o.lat.toFixed(5)+', '+o.lng.toFixed(5):'—'};
var byDateDesc=function(a,b){return b.date.localeCompare(a.date)||((b.createdAt||0)-(a.createdAt||0))};

var idb=null;
function idbOpen(){return new Promise(function(res){try{var r=indexedDB.open('smpm-carnet',1);r.onupgradeneeded=function(){r.result.createObjectStore('p',{keyPath:'id'})};r.onsuccess=function(){idb=r.result;res()};r.onerror=function(){res()};r.onblocked=function(){res()}}catch(e){res()}})}
function idbAll(){return new Promise(function(res){if(!idb)return res([]);try{var q=idb.transaction('p').objectStore('p').getAll();q.onsuccess=function(){res(q.result||[])};q.onerror=function(){res([])}}catch(e){res([])}})}
function idbPut(p){return new Promise(function(res){if(!idb)return res();try{var t=idb.transaction('p','readwrite');t.objectStore('p').put(p);t.oncomplete=function(){res()};t.onerror=function(){res()}}catch(e){res()}})}
function idbDel(id){return new Promise(function(res){if(!idb)return res();try{var t=idb.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=function(){res()};t.onerror=function(){res()}}catch(e){res()}})}
function fileToDataUrl(file){return new Promise(function(res,rej){var url=URL.createObjectURL(file);var img=new Image();img.onload=function(){var M=1280,w=img.width,h=img.height,k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.72))};img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};img.src=url})}

/* ---------- Position et adresse ---------- */
function getPos(){return new Promise(function(res,rej){
  if(!navigator.geolocation)return rej(new Error('nogeo'));
  var done=false,t=setTimeout(function(){if(!done){done=true;rej(new Error('timeout'))}},12000);
  try{navigator.geolocation.getCurrentPosition(function(p){if(done)return;done=true;clearTimeout(t);res({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy})},function(e){if(done)return;done=true;clearTimeout(t);rej(e)},{enableHighAccuracy:true,timeout:10000,maximumAge:30000})}catch(e){done=true;clearTimeout(t);rej(e)}
})}
function geocode(q){var c=new AbortController();var t=setTimeout(function(){c.abort()},6000);
  return fetch('https://data.geopf.fr/geocodage/search?limit=1&q='+encodeURIComponent(q),{signal:c.signal,headers:{'Accept':'application/json'}})
    .then(function(r){return r.json()}).then(function(j){clearTimeout(t);var f=j&&j.features&&j.features[0];return f&&f.geometry?{lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]}:null}).catch(function(){clearTimeout(t);return null})}

var mainEl=$('#main'),tabbar=$('#tabbar'),toastEl=$('#toast'),toastT=null;
function toast(msg){toastEl.textContent=msg;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){toastEl.hidden=true},2800)}
function sheet(html,cls){
  var o=document.createElement('div');o.className='overlay'+(cls?' '+cls:'');
  o.innerHTML='<div class="'+(cls==='lb'?'lbox':'sheet')+'" role="dialog" aria-modal="true">'+html+'</div>';
  var close=function(){o.remove();document.removeEventListener('keydown',esc_)};
  var esc_=function(e){if(e.key==='Escape')close()};
  o.addEventListener('click',function(e){if(e.target===o)close()});
  document.addEventListener('keydown',esc_);
  document.body.appendChild(o);
  return {el:o.firstElementChild,close:close};
}
var state={screen:'home',params:{}},stack=[],draft=null;
function go(screen,params){stack.push({screen:state.screen,params:state.params});state.screen=screen;state.params=params||{};render()}
function back(){var p=stack.pop();if(p){state.screen=p.screen;state.params=p.params}else{state.screen='home';state.params={}}render()}
function tab(name){stack.length=0;state.screen=name;state.params={};render()}

function newEvent(type,preset){

  draft={id:null,type:type,dateStr:'',mode:preset.mode||'',siteId:preset.siteId||null,address:preset.address||'',lat:preset.lat!=null?preset.lat:null,lng:preset.lng!=null?preset.lng:null,man:[],manOther:'',act:[],actOther:'',mat:[],matOther:'',newPhotos:[],removed:[],addSite:false,siteName:'',createdAt:null};
  go('form');
}

  draft={id:e.id,type:e.type,dateStr:fmtFR(e.date),mode:e.siteId&&db.sites.some(function(s){return s.id===e.siteId})?'site':'other',siteId:e.siteId,address:e.address,lat:e.lat,lng:e.lng,man:(e.man||[]).slice(),manOther:e.manOther||'',act:(e.act||[]).slice(),actOther:e.actOther||'',mat:(e.mat||[]).slice(),matOther:e.matOther||'',newPhotos:[],removed:[],addSite:false,siteName:'',createdAt:e.createdAt,demo:e.demo};

  if(!draft){tab('home');return}
  var d=draft,isI=d.type==='intervention';
  var title=d.id?'Modifier la fiche':(isI?'Nouvelle intervention':'Nouvel entraînement');
  var siteOpts='';
  if(db.sites.length)siteOpts='<optgroup label="Sites connus">'+db.sites.slice().sort(function(a,b){return a.name.localeCompare(b.name,'fr')}).map(function(s){return '<option value="s:'+s.id+'">'+esc(s.name)+'</option>'}).join('')+'</optgroup>';

    '<div class="field"><label for="site">Adresse</label><select id="site"><option value="">Choisir un lieu</option>'+siteOpts+'<option value="gps">Ma position actuelle (GPS)</option><option value="other">Autre adresse (saisie manuelle)</option></select><div id="addrExtra"></div><p class="err" id="addrErr" hidden></p></div>'+

    '<div class="pa"><label class="pbtn" for="photoIn">'+ic('camera',30)+'<span>Photo</span></label><input type="file" id="photoIn" accept="image/*" capture="environment" multiple hidden>'+
    '<a class="pbtn" href="'+RISK_URL+'" target="_blank" rel="noopener noreferrer">'+ic('shield',30)+'<span>Analyse de risque</span></a></div>'+
    '<div class="thumbs" id="thumbs"></div>'+
    '<button class="btn primary" id="save">Enregistrer la fiche</button></div>';

  $('#fBack').onclick=function(){draft=null;back()};
  var dateIn=$('#date');dateIn.value=d.dateStr;
  dateIn.oninput=function(){var v=dateIn.value.replace(/\D/g,'').slice(0,8),o=v;if(v.length>4)o=v.slice(0,2)+'/'+v.slice(2,4)+'/'+v.slice(4);else if(v.length>2)o=v.slice(0,2)+'/'+v.slice(2);dateIn.value=o;d.dateStr=o;$('#dateErr').hidden=true};

  var sel=$('#site');
  sel.value=d.mode==='site'&&d.siteId?'s:'+d.siteId:(d.mode==='gps'?'gps':(d.mode==='other'?'other':''));
  sel.onchange=function(){
    var v=sel.value;$('#addrErr').hidden=true;
    if(v.indexOf('s:')===0){var s=db.sites.find(function(x){return x.id===v.slice(2)});d.mode='site';d.siteId=s.id;d.address=s.name;d.lat=s.lat;d.lng=s.lng}
    else if(v==='gps'){d.mode='gps';d.siteId=null;d.address='';d.lat=d.lng=null;d.gpsErr='';updateAddr();fetchGps();return}
    else if(v==='other'){d.mode='other';d.siteId=null;d.address='';d.lat=d.lng=null}

function updateAddr(){
  var ex=$('#addrExtra'),d=draft,h='';if(!ex)return;
  if(d.mode==='site')h='<p class="hint">Site connu · '+coord(d)+'</p>';
  if(d.mode==='gps')h='<div class="row2"><button type="button" class="btn ghost sm" id="gpsAgain">Relever la position</button><span class="hint" id="gpsSt">'+(d.gpsBusy?'Recherche de la position…':(d.lat!=null?'Position relevée : '+coord(d):(d.gpsErr||'Position non relevée.')))+'</span></div><input type="text" id="addr" autocomplete="off" placeholder="Nom du lieu (facultatif)" value="'+esc(d.address)+'">';
  if(d.mode==='other')h='<input type="text" id="addr" autocomplete="street-address" placeholder="Numéro, rue, commune ou nom du lieu" value="'+esc(d.address)+'"><div class="row2"><button type="button" class="btn ghost sm" id="pickMap">Placer sur la carte</button><span class="hint">'+(d.lat!=null?'Point : '+coord(d):'Aucun point sur la carte')+'</span></div>';
  if(d.mode==='gps'||d.mode==='other')h+='<label class="chk"><input type="checkbox" id="addSite"'+(d.addSite?' checked':'')+'><span>Ajouter aux sites connus</span></label><input type="text" id="siteName" autocomplete="off" placeholder="Nom du site" value="'+esc(d.siteName)+'"'+(d.addSite?'':' hidden')+'>';
  ex.innerHTML=h;
  var a=$('#addr');if(a)a.oninput=function(){d.address=a.value};
  var g=$('#gpsAgain');if(g)g.onclick=fetchGps;
  var p=$('#pickMap');if(p)p.onclick=function(){go('map',{pick:true})};
  var cs=$('#addSite');if(cs)cs.onchange=function(){d.addSite=cs.checked;var sn=$('#siteName');sn.hidden=!cs.checked;if(cs.checked)sn.focus()};
  var sn=$('#siteName');if(sn)sn.oninput=function(){d.siteName=sn.value};
}
function fetchGps(){
  var d=draft;d.gpsBusy=true;d.gpsErr='';updateAddr();
  getPos().then(function(p){d.gpsBusy=false;d.lat=p.lat;d.lng=p.lng;if(state.screen==='form')updateAddr()})
  .catch(function(){d.gpsBusy=false;d.gpsErr='Position indisponible. Autorisez la localisation ou choisissez « Autre adresse ».';if(state.screen==='form')updateAddr()});
}

async function saveDraft(){
  var d=draft,btn=$('#save'),aerr=$('#addrErr');
  var iso=parseFR((d.dateStr||'').trim());
  $('#dateErr').hidden=!!iso;
  if(!iso){$('#date').focus();return}
  var showErr=function(m){aerr.textContent=m;aerr.hidden=false;aerr.scrollIntoView({block:'center'})};

  }
  if(d.mode==='gps'&&d.lat==null){showErr('La position n’a pas été relevée. Touchez « Relever la position » ou choisissez « Autre adresse ».');return}
  if(!address)address=d.lat!=null?'Point '+coord(d):'';
  if((d.mode==='gps'||d.mode==='other')&&d.addSite&&d.lat!=null){
    var s={id:uid(),name:(d.siteName||'').trim()||address,lat:d.lat,lng:d.lng};db.sites.push(s);d.siteId=s.id;
  }
  var ev={id:d.id||uid(),type:d.type,date:iso,siteId:d.siteId||null,address:address,lat:d.lat,lng:d.lng,man:d.man.slice(),manOther:d.manOther||'',act:d.act.slice(),actOther:d.actOther||'',mat:d.mat.slice(),matOther:d.matOther||'',createdAt:d.createdAt||Date.now()};
  if(d.demo)ev.demo=true;
  var i=db.events.findIndex(function(x){return x.id===ev.id});
  if(i>-1)db.events[i]=ev;else db.events.push(ev);
  for(var r=0;r<d.removed.length;r++){await idbDel(d.removed[r]);photos=photos.filter(function(p){return p.id!==d.removed[r]})}
  for(var n=0;n<d.newPhotos.length;n++){var ph={id:d.newPhotos[n].id,ts:d.newPhotos[n].ts,dataUrl:d.newPhotos[n].dataUrl,eventId:ev.id,lat:ev.lat,lng:ev.lng};photos.push(ph);await idbPut(ph)}
  saveDb();draft=null;toast('Fiche enregistrée');tab('home');
}

/* ---------- Bilan ---------- */
var MONTHS=['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
var MONTHS_L=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
var SLOTS=7;
function rankCats(evs,getter){
  var cnt={};
  evs.forEach(function(e){getter(e).forEach(function(v){cnt[v]=(cnt[v]||0)+1})});
  var names=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]||a.localeCompare(b,'fr')});
  var cats=names.slice(0,SLOTS).map(function(n,i){return {name:n,n:cnt[n],ci:i}});
  var rest=names.slice(SLOTS);
  if(rest.length)cats.push({name:'Autres ('+rest.length+' types)',n:rest.reduce(function(s,k){return s+cnt[k]},0),ci:'x',rest:rest});
  var idx={};
  cats.forEach(function(c,i){if(c.rest)c.rest.forEach(function(k){idx[k]=i});else idx[c.name]=i});
  return {cats:cats,idx:idx,total:names.reduce(function(s,k){return s+cnt[k]},0)};
}
function catCol(c){return c.ci==='x'?'var(--sx)':'var(--s'+c.ci+')'}
function monthList(evs,per){
  var now=new Date(),out=[],sy,sm,ey,em;
  if(per==='year'){sy=ey=now.getFullYear();sm=0;em=11}
  else{
    var ds=evs.map(function(e){return e.date}).sort(),a=ds[0],b=ds[ds.length-1];
    sy=+a.slice(0,4);sm=+a.slice(5,7)-1;ey=+b.slice(0,4);em=+b.slice(5,7)-1;
    if(now.getFullYear()*12+now.getMonth()>ey*12+em){ey=now.getFullYear();em=now.getMonth()}
    while((ey*12+em)-(sy*12+sm)<5){sm--;if(sm<0){sm=11;sy--}}
  }
  for(var k=sy*12+sm;k<=ey*12+em;k++)out.push({y:Math.floor(k/12),m:k%12,k:k});
  return out;
}
function pieHtml(R,key,title){
  var tot=R.total,a=-Math.PI/2,h='';
  R.cats.forEach(function(c){
    var col=catCol(c),tip=c.name+' : '+c.n+' ('+Math.round(c.n/tot*100)+' %)';
    if(R.cats.length===1){h+='<circle class="tip" data-cap="cap-'+key+'-p" data-tip="'+esc(tip)+'" cx="100" cy="100" r="92" style="fill:'+col+'"><title>'+esc(tip)+'</title></circle>';return}
    var d=c.n/tot*2*Math.PI,a2=a+d;
    var x1=100+92*Math.cos(a),y1=100+92*Math.sin(a),x2=100+92*Math.cos(a2),y2=100+92*Math.sin(a2);
    h+='<path class="tip" data-cap="cap-'+key+'-p" data-tip="'+esc(tip)+'" d="M100 100 L'+x1.toFixed(2)+' '+y1.toFixed(2)+' A92 92 0 '+(d>Math.PI?1:0)+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' Z" style="fill:'+col+'" stroke="var(--surface)" stroke-width="2"><title>'+esc(tip)+'</title></path>';
    a=a2;
  });
  return '<svg class="pie" viewBox="0 0 200 200" role="img" aria-label="Camembert : '+esc(title)+'">'+h+'</svg>';
}
function chronoHtml(R,evs,getter,per,key,title){
  var ml=monthList(evs,per),n=ml.length,pos={};
  ml.forEach(function(m,i){pos[m.k]=i});
  var cnt=ml.map(function(){return R.cats.map(function(){return 0})});
  evs.forEach(function(e){
    var k=+e.date.slice(0,4)*12+(+e.date.slice(5,7)-1),i=pos[k];if(i==null)return;
    getter(e).forEach(function(v){cnt[i][R.idx[v]]++});
  });
  var tot=cnt.map(function(r){return r.reduce(function(s,x){return s+x},0)});
  var max=Math.max.apply(null,tot.concat([1])),step=1;
  [1,2,5,10,20,50,100,200,500].some(function(s){step=s;return max/s<=5});
  var yMax=Math.ceil(max/step)*step;
  var pitch=26,bw=18,L=30,Rm=8,T=10,H=150,years=per==='all',B=years?34:22,W=L+Rm+n*pitch,Ht=T+H+B;
  var yy=function(v){return T+H-v/yMax*H};
  var g='';
  for(var v=0;v<=yMax;v+=step){
    g+='<line x1="'+L+'" x2="'+(W-Rm)+'" y1="'+yy(v)+'" y2="'+yy(v)+'" class="'+(v===0?'base':'grid')+'"/><text x="'+(L-5)+'" y="'+(yy(v)+3.5)+'" text-anchor="end" class="ax">'+v+'</text>';
  }
  var bars='',lab='';
  ml.forEach(function(m,i){
    var x=L+i*pitch+(pitch-bw)/2,acc=0;
    R.cats.forEach(function(c,j){
      var q=cnt[i][j];if(!q)return;
      var y0=yy(acc),y1=yy(acc+q),tip=MONTHS_L[m.m]+' '+m.y+' · '+c.name+' : '+q;
      bars+='<rect class="tip" data-cap="cap-'+key+'-c" data-tip="'+esc(tip)+'" x="'+x+'" y="'+y1.toFixed(2)+'" width="'+bw+'" height="'+(y0-y1).toFixed(2)+'" style="fill:'+catCol(c)+'" stroke="var(--surface)" stroke-width="1.5"><title>'+esc(tip)+'</title></rect>';
      acc+=q;
    });
    var cx=x+bw/2;
    lab+='<text x="'+cx+'" y="'+(T+H+13)+'" text-anchor="middle" class="ax">'+MONTHS[m.m]+'</text>';
    if(years&&(m.m===0||i===0))lab+='<text x="'+cx+'" y="'+(T+H+26)+'" text-anchor="middle" class="ax ay">'+m.y+'</text>';
  });
  var rows=ml.map(function(m,i){
    if(!tot[i])return '';
    var parts=R.cats.map(function(c,j){return cnt[i][j]?esc(c.name)+' '+cnt[i][j]:''}).filter(Boolean).join(', ');
    return '<tr><th scope="row">'+MONTHS_L[m.m]+' '+m.y+'</th><td>'+tot[i]+'</td><td>'+parts+'</td></tr>';
  }).join('');
  return '<div class="cscroll"><svg viewBox="0 0 '+W+' '+Ht+'" style="width:100%;min-width:'+(n>12?W:0)+'px;height:auto" role="img" aria-label="Histogramme mensuel : '+esc(title)+'">'+g+bars+lab+'</svg></div>'+
    '<p class="tt" id="cap-'+key+'-c">Touchez une barre pour le détail.</p>'+
    '<details class="dtab"><summary>Voir le tableau mensuel</summary><div class="cscroll"><table><thead><tr><th>Mois</th><th>Total</th><th>Détail</th></tr></thead><tbody>'+rows+'</tbody></table></div></details>';
}
function chartBlock(key,title,evs,getter,per){
  var R=rankCats(evs,getter);
  if(!R.total)return '<section class="bsec cc"><h3>'+title+'</h3><p class="hint">Aucune donnée sur cette période.</p></section>';
  return '<section class="bsec cc"><h3>'+title+'</h3><div class="prow">'+pieHtml(R,key,title)+
    '<ul class="lg" aria-label="Détail par type">'+R.cats.map(function(c){return '<li class="tip" data-cap="cap-'+key+'-p" data-tip="'+esc(c.name+' : '+c.n+' ('+Math.round(c.n/R.total*100)+' %)')+'"><i class="sw" style="background:'+catCol(c)+'"></i><span class="nm">'+esc(c.name)+'</span><span class="vv">'+c.n+' · '+Math.round(c.n/R.total*100)+' %</span></li>'}).join('')+'</ul></div>'+
    '<p class="tt" id="cap-'+key+'-p">'+R.total+' au total. Touchez une part pour le détail.</p>'+
    '<h4 class="ch">Nombre par mois</h4>'+chronoHtml(R,evs,getter,per,key,title)+'</section>';
}

var curTile=function(){return TILES.find(function(t){return t.id===tileId})||TILES[0]};
var M={z:11,lat:45.19,lng:5.72,w:0,h:0,tiles:new Map(),mk:[],user:null,ro:null,raf:0,fitted:false,ok:0,err:0,warned:false};
function project(lat,lng,z){var s=256*Math.pow(2,z),sin=Math.sin(lat*Math.PI/180);return {x:(lng+180)/360*s,y:(0.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*s}}
function unproject(x,y,z){var s=256*Math.pow(2,z),n=Math.PI-2*Math.PI*y/s;return {lat:180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))),lng:x/s*360-180}}
function cleanupMap(){if(M.ro){M.ro.disconnect();M.ro=null}M.tiles=new Map();M.mk=[];cancelAnimationFrame(M.raf)}
function groups(){

    '<div class="ctl cs"><button class="cbtn" id="lay" aria-label="Changer le fond de carte">'+ic('layers',24)+'</button><div class="zoom"><button id="zi" aria-label="Zoom avant">'+ic('plus')+'</button><button id="zo" aria-label="Zoom arrière">'+ic('minus')+'</button></div><button class="cbtn" id="rec" aria-label="Recentrer sur ma position">'+ic('target',26)+'</button></div>'+
    (pick?'':'<div class="ctl mhint">Appui long : ajouter un site</div>')+
    '<div class="attr" id="attr"></div>';
  M.ok=0;M.err=0;M.warned=false;$('#attr').innerHTML=curTile().attr;
  var vp=$('#vp'),tlL=$('#tlL'),mkL=$('#mkL');
  var measure=function(){M.w=vp.clientWidth;M.h=vp.clientHeight;draw()};
  M.w=vp.clientWidth||360;M.h=vp.clientHeight||480;
  if(p.focus){M.lat=p.focus.lat;M.lng=p.focus.lng;M.z=p.focus.z||16}
  else if(!M.fitted){var gs=groups().filter(function(x){return x.events.length});if(gs.length){var la=gs.map(function(x){return x.lat}),ln=gs.map(function(x){return x.lng});M.lat=(Math.min.apply(null,la)+Math.max.apply(null,la))/2;M.lng=(Math.min.apply(null,ln)+Math.max.apply(null,ln))/2;var span=Math.max(Math.max.apply(null,la)-Math.min.apply(null,la),Math.max.apply(null,ln)-Math.min.apply(null,ln));M.z=span>0.6?9:span>0.2?10:span>0.05?12:14;M.fitted=true}}

  function buildMarkers(){
    mkL.innerHTML='';M.mk=[];
    groups().forEach(function(gr){
      var inter=gr.events.some(function(e){return e.type==='intervention'});
      var col=gr.events.length?(inter?'var(--red)':'var(--blue)'):'var(--yellow)';
      var el=document.createElement('button');el.className='mk';el.type='button';
      el.setAttribute('aria-label',(gr.name||'Lieu')+(gr.events.length?' : '+gr.events.length+' fiche(s)':' : site'));
      el.innerHTML=pin(col,34)+(gr.events.length>1?'<span class="cnt">'+gr.events.length+'</span>':'');
      var lpT=null,long_=false,sx=0,sy=0,moved=false;
      el.addEventListener('pointerdown',function(e){e.stopPropagation();long_=false;moved=false;sx=e.clientX;sy=e.clientY;clearTimeout(lpT);lpT=setTimeout(function(){long_=true;markerLong(gr)},550)});
      el.addEventListener('pointermove',function(e){if(Math.hypot(e.clientX-sx,e.clientY-sy)>8){moved=true;clearTimeout(lpT)}});
      el.addEventListener('pointerup',function(e){e.stopPropagation();clearTimeout(lpT);if(!long_&&!moved)markerTap(gr)});
      el.addEventListener('pointercancel',function(){clearTimeout(lpT)});
      el.addEventListener('contextmenu',function(e){e.preventDefault()});
      mkL.appendChild(el);M.mk.push({el:el,lat:gr.lat,lng:gr.lng});
    });
    var me=document.createElement('div');me.className='me';me.hidden=!M.user;me.id='meDot';mkL.appendChild(me);
  }
  function draw(){
    var c=project(M.lat,M.lng,M.z),ox=c.x-M.w/2,oy=c.y-M.h/2,z=M.z,n=Math.pow(2,z);
    var x0=Math.floor(ox/256),x1=Math.floor((ox+M.w)/256),y0=Math.floor(oy/256),y1=Math.floor((oy+M.h)/256),need={};
    for(var x=x0;x<=x1;x++)for(var y=y0;y<=y1;y++){
      if(y<0||y>=n)continue;
      var xm=((x%n)+n)%n,key=tileId+'/'+z+'/'+xm+'/'+y+'@'+x;need[key]=1;
      var el=M.tiles.get(key);
      if(!el){el=new Image();el.className='mt';el.alt='';el.draggable=false;el.onload=function(){M.ok++};el.onerror=function(){this.style.display='none';M.err++;if(M.err>=4&&M.ok===0&&!M.warned){M.warned=true;toast('Fond de carte indisponible. Essayez un autre fond avec le bouton en bas à droite.')}};el.src=curTile().url(z,xm,y);tlL.appendChild(el);M.tiles.set(key,el)}
      el.style.transform='translate('+(x*256-ox)+'px,'+(y*256-oy)+'px)';
    }
    M.tiles.forEach(function(el,k){if(!need[k]){el.remove();M.tiles.delete(k)}});
    vp.style.backgroundPosition=(-(ox%64))+'px '+(-(oy%64))+'px';
    M.mk.forEach(function(m){var q=project(m.lat,m.lng,z);m.el.style.transform='translate('+(q.x-ox)+'px,'+(q.y-oy)+'px) translate(-50%,-100%)'});
    var me=$('#meDot');if(me&&M.user){var u=project(M.user.lat,M.user.lng,z);me.hidden=false;me.style.transform='translate('+(u.x-ox)+'px,'+(u.y-oy)+'px)'}
  }
  var sched=function(){cancelAnimationFrame(M.raf);M.raf=requestAnimationFrame(draw)};
  function zoomAt(dz,px,py){
    var nz=Math.max(3,Math.min(18,M.z+dz));if(nz===M.z)return;
    var c=project(M.lat,M.lng,M.z),ll=unproject(c.x-M.w/2+px,c.y-M.h/2+py,M.z);
    M.z=nz;var q=project(ll.lat,ll.lng,nz),nc=unproject(q.x-px+M.w/2,q.y-py+M.h/2,nz);M.lat=nc.lat;M.lng=nc.lng;sched();
  }
  buildMarkers();draw();
  M.ro=new ResizeObserver(measure);M.ro.observe(vp);

  /* gestes */
  var ptrs=new Map(),pan=null,pinch=null,lpT=null,lastWheel=0;
  vp.addEventListener('pointerdown',function(e){
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});
    try{vp.setPointerCapture(e.pointerId)}catch(x){}
    if(ptrs.size===1){
      pan={x:e.clientX,y:e.clientY,c:project(M.lat,M.lng,M.z)};
      var r=vp.getBoundingClientRect();clearTimeout(lpT);
      lpT=setTimeout(function(){if(ptrs.size===1){var q=Array.from(ptrs.values())[0];onLong(q.x-r.left,q.y-r.top)}},600);
    }else if(ptrs.size===2){clearTimeout(lpT);var a=Array.from(ptrs.values());pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};pan=null}
  });
  vp.addEventListener('pointermove',function(e){
    var q=ptrs.get(e.pointerId);if(!q)return;
    q.x=e.clientX;q.y=e.clientY;
    if(Math.hypot(q.x-q.sx,q.y-q.sy)>8)clearTimeout(lpT);
    if(ptrs.size===1&&pan){var n=unproject(pan.c.x-(e.clientX-pan.x),pan.c.y-(e.clientY-pan.y),M.z);M.lat=Math.max(-84,Math.min(84,n.lat));M.lng=n.lng;sched()}
    else if(ptrs.size===2&&pinch){var a=Array.from(ptrs.values()),d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),r=vp.getBoundingClientRect(),mx=(a[0].x+a[1].x)/2-r.left,my=(a[0].y+a[1].y)/2-r.top;
      if(d/pinch.d>1.6){zoomAt(1,mx,my);pinch.d=d}else if(d/pinch.d<0.62){zoomAt(-1,mx,my);pinch.d=d}}
  });
  var up=function(e){
    clearTimeout(lpT);ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
    if(ptrs.size===1){var q=Array.from(ptrs.values())[0];pan={x:q.x,y:q.y,c:project(M.lat,M.lng,M.z)}}else if(ptrs.size===0)pan=null;
  };
  vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
  vp.addEventListener('contextmenu',function(e){e.preventDefault()});
  vp.addEventListener('wheel',function(e){e.preventDefault();var t=Date.now();if(t-lastWheel<180)return;lastWheel=t;var r=vp.getBoundingClientRect();zoomAt(e.deltaY<0?1:-1,e.clientX-r.left,e.clientY-r.top)},{passive:false});
  vp.addEventListener('dblclick',function(e){var r=vp.getBoundingClientRect();zoomAt(1,e.clientX-r.left,e.clientY-r.top)});
  $('#zi').onclick=function(){zoomAt(1,M.w/2,M.h/2)};
  $('#zo').onclick=function(){zoomAt(-1,M.w/2,M.h/2)};
  $('#lay').onclick=function(){
    var sh=sheet('<h3>Fond de carte</h3>'+TILES.map(function(t){return '<button class="row" data-t="'+t.id+'"><span class="rt"><b>'+t.label+(t.id===tileId?' \u2713':'')+'</b><small>'+t.sub+'</small></span></button>'}).join(''));
    $$('[data-t]',sh.el).forEach(function(b){b.onclick=function(){tileId=b.dataset.t;try{localStorage.setItem('smpm.tiles',tileId)}catch(e){}M.ok=0;M.err=0;M.warned=false;$('#attr').innerHTML=curTile().attr;sh.close();draw()}});
  };
  $('#rec').onclick=function(){
    getPos().then(function(pos){M.user={lat:pos.lat,lng:pos.lng};M.lat=pos.lat;M.lng=pos.lng;M.z=Math.max(M.z,15);draw()})
    .catch(function(){toast('Position indisponible. Autorisez la localisation dans le navigateur.')});
  };
  var px=$('#pickX');if(px)px.onclick=back;
  getPos().then(function(pos){M.user=pos;var me=$('#meDot');if(me)draw()}).catch(function(){});

  function onLong(x,y){
    var c=project(M.lat,M.lng,M.z),ll=unproject(c.x-M.w/2+x,c.y-M.h/2+y,M.z);
    if(pick){if(draft){draft.lat=ll.lat;draft.lng=ll.lng}toast('Point placé');back();return}
    addSiteSheet(ll,function(){buildMarkers();draw()});
  }
  function markerLong(gr){
    var s=sheet('<h3>Nouvelle fiche ici</h3><p class="hint">'+esc(gr.name||coord(gr))+'</p><div class="sbtns"><button class="btn primary" style="--tint:var(--blue)" id="nt">Entraînement</button><button class="btn primary" style="--tint:var(--red)" id="ni">Intervention</button></div>');
    var mk=function(type){s.close();newEvent(type,{mode:gr.site?'site':'other',siteId:gr.site?gr.site.id:null,address:gr.name||'',lat:gr.lat,lng:gr.lng})};
    $('#nt',s.el).onclick=function(){mk('training')};$('#ni',s.el).onclick=function(){mk('intervention')};
  }
  function markerTap(gr){
    if(gr.events.length===1){go('detail',{id:gr.events[0].id});return}
    var evs=gr.events.slice().sort(byDateDesc);
    var h='<h3>'+esc(gr.name||'Ce lieu')+'</h3>';
    if(evs.length){h+='<p class="hint">'+evs.length+' fiches ici. Choisissez une icône.</p><div class="picks">'+evs.map(function(e){var i=e.type==='intervention';return '<button class="pk" data-e="'+e.id+'">'+pin(i?'var(--red)':'var(--blue)',26)+'<b>'+fmtFR(e.date)+'</b><small>'+(i?'Intervention':'Entraînement')+'</small></button>'}).join('')+'</div>'}
    else h+='<p class="hint">Site connu · '+coord(gr)+'. Aucune fiche pour l’instant.</p>';
    h+='<div class="sbtns"><button class="btn primary" style="--tint:var(--blue)" id="nt">Entraînement ici</button><button class="btn primary" style="--tint:var(--red)" id="ni">Intervention ici</button></div>';
    if(gr.site&&!evs.length)h+='<button class="btn ghost" id="ds" style="color:var(--red-text)">Supprimer ce site</button>';
    var s=sheet(h);
    $$('[data-e]',s.el).forEach(function(b){b.onclick=function(){s.close();go('detail',{id:b.dataset.e})}});
    var mk=function(type){s.close();newEvent(type,{mode:gr.site?'site':'other',siteId:gr.site?gr.site.id:null,address:gr.name||'',lat:gr.lat,lng:gr.lng})};
    $('#nt',s.el).onclick=function(){mk('training')};$('#ni',s.el).onclick=function(){mk('intervention')};
    var ds=$('#ds',s.el);if(ds)ds.onclick=function(){if(ds.dataset.sure!=='1'){ds.dataset.sure='1';ds.textContent='Confirmer la suppression';return}db.sites=db.sites.filter(function(x){return x.id!==gr.site.id});saveDb();s.close();buildMarkers();draw();toast('Site supprimé')};
  }
}
function addSiteSheet(ll,done){
  var s=sheet('<h3>Ajouter un site</h3><p class="hint">'+coord(ll)+'</p><label class="lbl" for="sn">Nom du site</label><input type="text" id="sn" autocomplete="off" placeholder="Ex. falaise école"><p class="err" id="snE" hidden>Donnez un nom au site.</p><div class="sbtns"><button class="btn ghost" id="sc">Annuler</button><button class="btn primary" id="sok">Enregistrer</button></div>');
  var inp=$('#sn',s.el);inp.focus();
  $('#sc',s.el).onclick=s.close;
  $('#sok',s.el).onclick=function(){var n=inp.value.trim();if(!n){$('#snE',s.el).hidden=false;inp.focus();return}db.sites.push({id:uid(),name:n,lat:ll.lat,lng:ll.lng});saveDb();s.close();toast('Site ajouté');done()};
}

/* ---------- Démarrage ---------- */
(async function(){
  loadDb();
  if(!db.seeded)seedDemo();
  await idbOpen();
  photos=await idbAll();
  render();
})();
})();
</script>
